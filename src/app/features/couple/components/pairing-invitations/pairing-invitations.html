<div class="invitations-container">
  <nz-card class="invitations-card" [nzBordered]="false">
    <div class="card-header">
      <h2 nz-typography class="title">
        <nz-icon nzType="heart" nzTheme="fill" class="heart-icon"></nz-icon>
        Lời mời ghép đôi
      </h2>
      <p class="subtitle">Những người muốn kết nối với bạn</p>
    </div>

    @if (listInvitations().length === 0) {
      <div class="empty-state">
        <nz-icon nzType="inbox" nzTheme="outline" class="empty-icon"></nz-icon>
        <p>Hiện tại chưa có lời mời ghép đôi nào.</p>
      </div>
    } @else {
      <nz-list nzItemLayout="horizontal">
        @for (item of listInvitations(); track item.id) {
          <nz-list-item class="invitation-item">
            <nz-list-item-meta
              [nzAvatar]="avatarTemplate"
              [nzTitle]="titleTemplate"
              [nzDescription]="descTemplate"
            >
              <ng-template #avatarTemplate>
                <nz-avatar [nzSrc]="item.sender.avatarUrl" [nzSize]="54" class="user-avatar"></nz-avatar>
              </ng-template>
              <ng-template #titleTemplate>
                <span class="user-name">{{ item.sender.fullName }}</span>
              </ng-template>
              <ng-template #descTemplate>
                <span class="time-text">
                  <nz-icon nzType="clock-circle" nzTheme="outline"></nz-icon>
                  {{ formatDate(item.sender.createdAt)}}
                </span>
              </ng-template>
            </nz-list-item-meta>

            <ul nz-list-item-actions>
              <nz-list-item-action>
                <button nz-button nzType="primary" class="accept-btn" (click)="acceptInvitation(item.idInvitation)">
                  <nz-icon nzType="check"></nz-icon>
                  Xác nhận
                </button>
              </nz-list-item-action>
              <nz-list-item-action>
                <button nz-button nzType="default" class="reject-btn" (click)="rejectInvitation(item.idInvitation)">
                  <nz-icon nzType="close"></nz-icon>
                  Từ chối
                </button>
              </nz-list-item-action>
            </ul>
          </nz-list-item>
        }
            <div *ngIf="paging().total > 10" class="pagination-container">
            <nz-pagination 
              [nzPageIndex]="paging().page" 
              [nzTotal]="paging().total" 
              [nzPageSize]="paging().pageSize"
              (nzPageIndexChange)="onPageIndexChange($event)"
             >
            </nz-pagination>
          </div>
      </nz-list>
    }
  </nz-card>
</div>
